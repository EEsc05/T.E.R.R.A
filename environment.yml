name: terra
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - numpy=2.5.4
  - scipy=1.18.1
  - pandas=3.1.0
  - scikit-learn=1.9.1
  - joblib=1.6.0
  - asf_search
  - h5py
  - shapely
  - pyproj
  - pip
  - pip:
      - --index-url https://download.pytorch.org/whl/cpu
      - torch==2.9.1+cpu
